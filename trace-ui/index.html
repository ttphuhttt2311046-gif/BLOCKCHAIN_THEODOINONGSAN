<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tra cứu nguồn gốc</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="../css/trace-ui.css">
</head>
<body>
  <main class="card">
    <a class="home-link" href="../index.html" target="_top">← Trang chủ</a>
    <h1 class="title">Tra cứu nguồn gốc sản phẩm</h1>

    <label class="label" for="pid">Mã lô nông sản</label>
    <div class="search-row">
      <span class="search-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 6v12M8 6v12M11 6v12M15 6v12M18 6v12M20 6v12"/>
        </svg>
      </span>
      <input id="pid" placeholder="Nhập mã lô nông sản" autocomplete="off">
      <button class="btn-search" type="button" onclick="traCuu(document.getElementById('pid').value.trim())">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
        </svg>
        <span>Tra cứu</span>
      </button>
    </div>

    <button class="qr-link" type="button" onclick="batQuet()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v3M14 20h3M20 20h1"/>
      </svg>
      Quét mã QR bằng camera
    </button>

    <div id="reader"></div>
    <button id="btnDung" type="button" onclick="stopQuet()">Dừng quét</button>

    <div id="ketqua"></div>
    <div id="map" aria-label="Bản đồ hành trình lô hàng"></div>
  </main>

  <script src="config.php"></script>
  <script src="app.js"></script>
</body>
</html>
