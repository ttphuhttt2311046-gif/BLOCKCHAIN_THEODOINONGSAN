<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tra cứu nguồn gốc</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<link rel="stylesheet" href="trace-ui.css">
</head>
<body>
  <h2>Tra cứu nguồn gốc sản phẩm</h2>

  <div class="toolbar">
    <input id="pid" placeholder="Mã lô hàng" inputmode="numeric">
    <button onclick="traCuu(document.getElementById('pid').value.trim())">Tra cứu</button>
    <button onclick="batQuet()">Quét QR</button>
  </div>

  <div id="reader"></div>
  <button id="btnDung" onclick="stopQuet()">Dừng quét</button>

  <div id="ketqua"></div>
  <script src="app.js"></script>
</body>
</html>
